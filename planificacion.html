<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planificación · Parte Diario Telice</title>
<style>
  :root{
    --azul:#1F3864; --azul2:#2d4a7c; --verde:#548235; --naranja:#C55A11;
    --bg:#f4f5f7; --card:#ffffff; --border:#e3e6ea; --border2:#cfd4da;
    --text:#1a2433; --text2:#5b6573; --finde:#fbf3e9; --hoy:#eef4ff;
    --font:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13px}

  header{background:var(--azul);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  header h1{font-size:17px;font-weight:600;letter-spacing:.2px}
  header .sub{font-size:11px;opacity:.7;margin-top:2px}
  .obra-pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600}

  .toolbar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .nav-quincena{display:flex;align-items:center;gap:8px}
  .nav-quincena button{width:32px;height:32px;border:1px solid var(--border2);background:#fff;border-radius:6px;cursor:pointer;font-size:15px;color:var(--azul);display:flex;align-items:center;justify-content:center;transition:.15s}
  .nav-quincena button:hover{background:var(--azul);color:#fff;border-color:var(--azul)}
  .rango{font-weight:600;font-size:13px;min-width:230px;text-align:center}
  .rango .sem: {color:var(--text2)}
  .toolbar label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;font-weight:600}
  .toolbar input[type=date]{border:1px solid var(--border2);border-radius:6px;padding:6px 9px;font-family:var(--font);font-size:13px}
  .spacer{flex:1}
  .btn-guardar{background:var(--verde);color:#fff;border:none;border-radius:6px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .btn-guardar:hover{background:#456b2b}
  .estado{font-size:12px;color:var(--text2)}

  .wrap{padding:18px 22px}
  .grid-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .grid-scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:1100px}
  thead th{background:var(--azul);color:#fff;font-weight:600;font-size:11px;padding:0;position:sticky;top:0;z-index:5}
  thead th .dia{padding:8px 4px;text-align:center;border-left:1px solid rgba(255,255,255,.12);min-width:54px}
  thead th .dia .dow{font-size:10px;opacity:.7;text-transform:uppercase;letter-spacing:.5px}
  thead th .dia .num{font-size:14px;font-weight:700;margin-top:1px}
  thead th.col-cod{text-align:left;padding:10px 12px;min-width:120px;position:sticky;left:0;z-index:6;background:var(--azul)}
  thead th.col-desc{text-align:left;padding:10px 12px;min-width:260px;position:sticky;left:120px;z-index:6;background:var(--azul)}
  thead th.col-med{padding:10px 8px;min-width:100px;text-align:right;position:sticky;left:380px;z-index:6;background:var(--azul)}
  thead th.col-tot{padding:10px 8px;min-width:70px;text-align:right;background:var(--azul2)}
  thead th.finde .dia{background:rgba(197,90,17,.35)}

  .cap-row td{background:#eef1f5;font-weight:700;font-size:11px;color:var(--azul);padding:6px 12px;text-transform:uppercase;letter-spacing:.5px;border-top:1px solid var(--border)}

  tbody td{border-top:1px solid var(--border);border-left:1px solid var(--border);padding:0}
  .col-cod-cell{padding:7px 12px;position:sticky;left:0;background:var(--card);z-index:2;border-left:none;font-weight:600;color:var(--azul);font-size:12px;white-space:nowrap}
  .col-desc-cell{padding:7px 12px;position:sticky;left:120px;background:var(--card);z-index:2;color:var(--text);font-size:12px;line-height:1.3}
  .col-med-cell{padding:7px 8px;text-align:right;position:sticky;left:380px;background:var(--card);z-index:2;font-size:11px;color:var(--text2);white-space:nowrap}
  .col-med-cell b{color:var(--text);font-size:12px}
  td.finde{background:var(--finde)}
  td.celda input{width:100%;height:100%;min-height:38px;border:none;background:transparent;text-align:center;font-family:var(--font);font-size:13px;color:var(--text);padding:7px 2px;-moz-appearance:textfield}
  td.celda input::-webkit-outer-spin-button,td.celda input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  td.celda input:focus{outline:2px solid var(--azul);outline-offset:-2px;background:#fff}
  td.celda input.lleno{background:#eaf3e3;font-weight:600;color:var(--verde)}
  td.finde.celda input.lleno{background:#f0e6d4;color:var(--naranja)}
  .col-tot-cell{padding:7px 8px;text-align:right;background:#f7f9fb;font-weight:600;font-size:12px;color:var(--azul)}
  .col-tot-cell.exceso{color:#c0392b}

  tfoot td{border-top:2px solid var(--azul);padding:8px;font-weight:700;font-size:12px;background:#f0f3f7;text-align:center}
  tfoot td.lbl{text-align:right;position:sticky;left:0;background:#f0f3f7;z-index:2;min-width:380px}
  tfoot td.finde{background:#f0e6d4}

  .leyenda{display:flex;gap:18px;margin-top:12px;font-size:11px;color:var(--text2);flex-wrap:wrap}
  .leyenda span{display:flex;align-items:center;gap:5px}
  .sw{width:13px;height:13px;border-radius:3px;display:inline-block}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--verde);color:#fff;padding:12px 24px;border-radius:8px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.2);transition:.3s;z-index:100}
  .toast.show{transform:translateX(-50%) translateY(0)}
  header select#selObra{background:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--azul);font-family:var(--font);cursor:pointer;min-width:240px}
  header select#selObra option{color:var(--azul);background:#fff}

</style>
<script src="msal-browser.min.js"></script>
<script src="sp-integracion.js"></script>
</head>
<body>

<header>
  <div>
    <h1>Planificación de obra</h1>
    <div class="sub">Parte Diario · Telice · <span id="estadoSP">Conectando con SharePoint…</span></div>
  </div>
  <select id="selObra" onchange="cargarObra(this.value)">
    <option value="23-039">23-039 · Renovación Norte</option>
    <option value="26-008">26-008 · LAV Lorca-Almería · Catenaria</option>
  </select>
</header>

<div class="toolbar">
  <div class="nav-quincena">
    <button onclick="moverQuincena(-1)" title="Quincena anterior">‹</button>
    <div class="rango" id="rango">—</div>
    <button onclick="moverQuincena(1)" title="Quincena siguiente">›</button>
  </div>
  <div>
    <label>Lunes de inicio</label><br>
    <input type="date" id="fechaInicio" onchange="onFechaManual()">
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <input type="text" id="buscador" placeholder="Buscar partida..." oninput="onFiltro()" style="border:1px solid var(--border2);border-radius:6px;padding:6px 10px;font-family:var(--font);font-size:13px;width:180px">
    <label style="display:flex;align-items:center;gap:5px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500;color:var(--text)">
      <input type="checkbox" id="chkSolo" onchange="onSoloPlan()"> Solo planificadas
    </label>
  </div>
  <div class="spacer"></div>
  <span class="estado" id="estado">Listo</span>
  <button class="btn-guardar" onclick="guardar()">Guardar planificación</button>
</div>

<div class="wrap">
  <div class="grid-card">
    <div class="grid-scroll">
      <table id="tabla">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
        <tfoot id="tfoot"></tfoot>
      </table>
    </div>
  </div>
  <div class="leyenda">
    <span><i class="sw" style="background:#eaf3e3"></i> Día planificado</span>
    <span><i class="sw" style="background:var(--finde)"></i> Fin de semana</span>
    <span><i class="sw" style="background:#f7f9fb;border:1px solid var(--border2)"></i> Total partida (14 días)</span>
    <span>El total compara con la medición de proyecto · en rojo si se supera</span>
  </div>
</div>

<div class="toast" id="toast">Planificación guardada</div>

<script>

const OBRAS = {
  '23-039': 'Renovación Norte',
  '26-008': 'LAV Lorca-Almería'
};
let obraActiva = '23-039';

// Partidas de la obra activa (de M_Partidas real, incluye precio venta/coste)
let PARTIDAS = [];
// Planificación: cod -> {fechaISO: cantidad}. Separada por obra.
let PLAN = {};
const PLAN_POR_OBRA = { '23-039':{}, '26-008':{} };
let soloPlanificadas = false;
let filtroTexto = '';

let lunesInicio;
let DATOS_SP = null;     // caché de la última lectura completa de SharePoint
let spListo = false;     // true cuando ya hay sesión y datos cargados

function estadoSP(msg){ const el=document.getElementById('estadoSP'); if(el) el.textContent = msg; }

// Conecta con SharePoint (login si hace falta) y trae M_Partidas + Planificacion.
// Si algo falla (sin red, sin sesión…) se avisa y se sigue en modo solo-lectura vacío,
// igual que hace el parte de trabajo cuando no hay SharePoint disponible.
async function conectarSP(){
  if (typeof SPTelice === 'undefined') { estadoSP('Sin conexión a SharePoint (sp-integracion.js no cargado)'); return false; }
  try{
    estadoSP('Conectando con SharePoint…');
    await SPTelice.ensureReady();
    if (!SPTelice.currentAccount()){
      estadoSP('Iniciando sesión…');
      await SPTelice.login();
    }
    estadoSP('Leyendo M_Partidas y Planificación…');
    DATOS_SP = await SPTelice.leerTodo(msg => estadoSP(msg));
    spListo = true;
    estadoSP('Conectado ✓');
    return true;
  }catch(e){
    console.warn('[Planificación] SharePoint no disponible:', e && e.message);
    estadoSP('Sin conexión a SharePoint · ' + (e && e.message || ''));
    spListo = false;
    return false;
  }
}

// Índice cod -> {pv, cu} de precio de venta y coste unitario, para calcular
// VentaPlanif/CostePlanif al guardar. Se reconstruye cada vez que se carga obra.
let PRECIOS = {};

function cargarObra(cod){
  obraActiva = cod;
  document.getElementById('selObra').value = cod;

  const partidasSP = (DATOS_SP && DATOS_SP.partidas || []).filter(p => (p.Proyecto||'').trim() === cod);
  PARTIDAS = partidasSP.map(p => ({
    cod: p.Codigo, cap: p.Capitulo || 'Sin capítulo', desc: p.Descripcion,
    ud: p.Ud, med: p.Medicion || 0
  }));
  PRECIOS = {};
  partidasSP.forEach(p => { PRECIOS[p.Codigo] = { pv: p.PrecioVenta || 0, cu: p.CosteUd || 0 }; });

  // Planificación ya guardada en SharePoint para esta obra
  PLAN = {};
  PARTIDAS.forEach(p => { PLAN[p.cod] = {}; });
  const planifSP = (DATOS_SP && DATOS_SP.planificacion || []).filter(p => (p.Proyecto||'').trim() === cod);
  planifSP.forEach(row => {
    if (!PLAN[row.CodProduccion]) PLAN[row.CodProduccion] = {};
    PLAN[row.CodProduccion][row.Fecha] = row.CantidadPlanif;
  });
  PLAN_POR_OBRA[cod] = PLAN;

  if (PARTIDAS.length === 0){
    estadoSP(spListo ? 'Esta obra no tiene partidas en M_Partidas' : 'Sin conexión a SharePoint');
  }
  render();
}

function lunesDeHoy(){
  const h = new Date();
  const dow = (h.getDay()+6)%7; // 0=lunes
  h.setDate(h.getDate()-dow);
  h.setHours(0,0,0,0);
  return h;
}
function iso(d){ return d.toISOString().slice(0,10); }
function fmtCorto(d){ return d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'}); }
function fmtLargo(d){ return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'}); }
function semanaISO(d){
  const t=new Date(d); t.setHours(0,0,0,0);
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  const s=new Date(t.getFullYear(),0,4);
  return 1+Math.round(((t-s)/86400000-3+((s.getDay()+6)%7))/7);
}

function dias14(){
  const arr=[];
  for(let i=0;i<14;i++){ const d=new Date(lunesInicio); d.setDate(d.getDate()+i); arr.push(d); }
  return arr;
}

function render(){
  const dias = dias14();
  document.getElementById('rango').innerHTML =
    `${fmtLargo(dias[0])} – ${fmtLargo(dias[13])} · <span style="color:var(--text2)">Sem ${semanaISO(dias[0])}–${semanaISO(dias[13])}</span>`;
  document.getElementById('fechaInicio').value = iso(lunesInicio);

  // cabecera
  let th='<tr><th class="col-cod">Código</th><th class="col-desc">Descripción</th><th class="col-med">Medición proy.</th>';
  dias.forEach(d=>{
    const fin=(d.getDay()===0||d.getDay()===6);
    const dow=d.toLocaleDateString('es-ES',{weekday:'short'}).slice(0,3);
    th+=`<th class="${fin?'finde':''}"><div class="dia"><div class="dow">${dow}</div><div class="num">${fmtCorto(d)}</div></div></th>`;
  });
  th+='<th class="col-tot">Total</th></tr>';
  document.getElementById('thead').innerHTML=th;

  // aplicar filtros
  let visibles = PARTIDAS.filter(p=>{
    if(soloPlanificadas && Object.keys(PLAN[p.cod]||{}).length===0) return false;
    if(filtroTexto){
      const t=filtroTexto.toLowerCase();
      if(!(p.cod.toLowerCase().includes(t)||p.desc.toLowerCase().includes(t)||p.cap.toLowerCase().includes(t))) return false;
    }
    return true;
  });

  // cuerpo agrupado por capítulo
  let body='', capActual=null;
  if(visibles.length===0){
    body=`<tr><td colspan="${dias.length+4}" style="padding:30px;text-align:center;color:var(--text2)">No hay partidas que coincidan con el filtro.</td></tr>`;
  }
  visibles.forEach((p,idx)=>{
    if(p.cap!==capActual){
      capActual=p.cap;
      body+=`<tr class="cap-row"><td colspan="${dias.length+4}">${p.cap}</td></tr>`;
    }
    body+=`<tr data-cod="${p.cod}">`;
    body+=`<td class="col-cod-cell">${p.cod}</td>`;
    body+=`<td class="col-desc-cell">${p.desc}</td>`;
    body+=`<td class="col-med-cell"><b>${p.med.toLocaleString('es-ES')}</b> ${p.ud}</td>`;
    dias.forEach(d=>{
      const fin=(d.getDay()===0||d.getDay()===6);
      const v=PLAN[p.cod][iso(d)]||'';
      body+=`<td class="celda ${fin?'finde':''}"><input type="number" min="0" step="any" value="${v}" data-cod="${p.cod}" data-fecha="${iso(d)}" oninput="onInput(this)"></td>`;
    });
    body+=`<td class="col-tot-cell" id="tot-${p.cod}">0</td>`;
    body+='</tr>';
  });
  document.getElementById('tbody').innerHTML=body;

  // pie: total por día
  let foot='<tr><td class="lbl" colspan="3">Total por día →</td>';
  dias.forEach(d=>{
    const fin=(d.getDay()===0||d.getDay()===6);
    foot+=`<td class="${fin?'finde':''}" id="totdia-${iso(d)}">0</td>`;
  });
  foot+='<td></td></tr>';
  document.getElementById('tfoot').innerHTML=foot;

  recalcular();
}

function onInput(inp){
  const cod=inp.dataset.cod, f=inp.dataset.fecha;
  const v=parseFloat(inp.value);
  if(v&&v>0){ PLAN[cod][f]=v; inp.classList.add('lleno'); }
  else { delete PLAN[cod][f]; inp.classList.remove('lleno'); }
  recalcular();
  marcarSinGuardar();
}

function recalcular(){
  const dias=dias14();
  // total por partida
  PARTIDAS.forEach(p=>{
    let t=0; Object.values(PLAN[p.cod]).forEach(v=>t+=v);
    const cell=document.getElementById('tot-'+p.cod);
    if(cell){ cell.textContent=t.toLocaleString('es-ES'); cell.classList.toggle('exceso', t>p.med); }
  });
  // total por día
  dias.forEach(d=>{
    let t=0; PARTIDAS.forEach(p=>{ if(PLAN[p.cod][iso(d)]) t+=PLAN[p.cod][iso(d)]; });
    const cell=document.getElementById('totdia-'+iso(d));
    if(cell) cell.textContent = t? t.toLocaleString('es-ES') : '0';
  });
  // marcar inputs llenos
  document.querySelectorAll('td.celda input').forEach(inp=>{
    const has=PLAN[inp.dataset.cod][inp.dataset.fecha];
    inp.classList.toggle('lleno', !!has);
  });
}

function moverQuincena(dir){
  lunesInicio.setDate(lunesInicio.getDate()+dir*14);
  render();
}
function onFechaManual(){
  const v=document.getElementById('fechaInicio').value;
  if(!v) return;
  const d=new Date(v+'T00:00:00');
  // forzar a lunes
  const dow=(d.getDay()+6)%7;
  d.setDate(d.getDate()-dow);
  lunesInicio=d;
  render();
}

let estadoTimer;
function marcarSinGuardar(){
  document.getElementById('estado').textContent='Cambios sin guardar';
  document.getElementById('estado').style.color='var(--naranja)';
}

async function guardar(){
  // Genera TODAS las filas del estado actual (incluir cantidad = 0 no; solo lo planificado)
  const filas=[];
  PARTIDAS.forEach(p=>{
    const precio = PRECIOS[p.cod] || { pv:0, cu:0 };
    Object.entries(PLAN[p.cod]).forEach(([f,cant])=>{
      filas.push({
        Clave:`${obraActiva}|${p.cod}|${f}`,
        Proyecto:obraActiva, Fecha:f, Semana:semanaISO(new Date(f+'T00:00:00')),
        CodProduccion:p.cod, Descripcion:p.desc, Ud:p.ud, CantidadPlanif:cant,
        VentaPlanif: +(cant * precio.pv).toFixed(2),
        CostePlanif: +(cant * precio.cu).toFixed(2)
      });
    });
  });

  if (typeof SPTelice === 'undefined' || !SPTelice.guardarPlanificacion){
    console.log('[Planificacion] SharePoint no disponible, filas que se habrían guardado:', filas);
    document.getElementById('estado').textContent = 'Sin SharePoint · no guardado';
    document.getElementById('estado').style.color = 'var(--naranja)';
    return;
  }

  document.getElementById('estado').textContent = 'Guardando…';
  document.getElementById('estado').style.color = 'var(--text2)';
  try{
    const res = await SPTelice.guardarPlanificacion(obraActiva, filas);
    if (res.ok){
      document.getElementById('estado').textContent =
        `Guardado · ${res.creadas} nuevas, ${res.actualizadas} actualizadas, ${res.borradas} borradas`;
      document.getElementById('estado').style.color='var(--verde)';
      const t=document.getElementById('toast');
      t.textContent=`Planificación guardada · ${filas.length} líneas`;
      t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'),2200);
    } else {
      console.warn('[Planificacion] errores al guardar:', res.errores);
      document.getElementById('estado').textContent = `Guardado con ${res.errores.length} errores (ver consola)`;
      document.getElementById('estado').style.color = 'var(--naranja)';
    }
  }catch(e){
    console.error('[Planificacion] fallo al guardar:', e);
    document.getElementById('estado').textContent = 'Error al guardar: ' + e.message;
    document.getElementById('estado').style.color = '#c0392b';
  }
}

function onFiltro(){ filtroTexto=document.getElementById('buscador').value; render(); }
function onSoloPlan(){ soloPlanificadas=document.getElementById('chkSolo').checked; render(); }

// init: conecta con SharePoint, trae los datos reales y carga la obra por defecto
lunesInicio=lunesDeHoy();
(async () => {
  await conectarSP();
  cargarObra('23-039');
})();
</script>
</body>
</html>
