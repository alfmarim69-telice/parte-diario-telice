<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test lectura SharePoint · 11 maestros</title>
<style>
  body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#f4f6f9;color:#1a2230}
  header{background:#1a3a5c;color:#fff;padding:14px 18px;font-weight:700;letter-spacing:.04em}
  main{max-width:1040px;margin:0 auto;padding:18px}
  .card{background:#fff;border:1px solid #e4e8ee;border-radius:10px;padding:16px;margin-bottom:14px}
  button{background:#1a3a5c;color:#fff;border:0;border-radius:7px;padding:10px 16px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.45;cursor:not-allowed}
  .badge{display:inline-block;background:#e8f0f8;color:#1a3a5c;border-radius:6px;padding:4px 10px;font-size:13px;margin-left:8px}
  pre{background:#0f1722;color:#d6e2f0;padding:10px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.4;margin:4px 0}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{border:1px solid #e4e8ee;padding:6px 8px;text-align:left}
  th{background:#f0f3f7}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .ok{color:#137a3a}.err{color:#b3261e}.muted{color:#667}
  .note{font-size:13px;background:#fff7e6;border:1px solid #f0d999;border-radius:8px;padding:10px;margin-bottom:14px}
  h3{margin:14px 0 4px;font-size:14px;color:#1a3a5c}
</style>
</head>
<body>
<header>Test de lectura SharePoint · 11 maestros (modelo fiel)</header>
<main>

  <div class="card">
    <button id="btnLogin">Iniciar sesión</button>
    <button id="btnLeer" disabled>Leer 11 maestros</button>
    <span id="user" class="badge" style="display:none"></span>
  </div>

  <div class="card">
    <div style="font-weight:700;margin-bottom:6px">Estado</div>
    <div id="estado" class="muted">Pendiente de iniciar sesión.</div>
  </div>

  <div class="card" id="resumenCard" style="display:none">
    <div style="font-weight:700;margin-bottom:8px">Recuento por maestro</div>
    <div id="resumen"></div>
  </div>

  <div class="card" id="muestraCard" style="display:none">
    <div style="font-weight:700;margin-bottom:8px">Fila de ejemplo por maestro (verificar nombres reales)</div>
    <div id="muestra"></div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2/lib/msal-browser.js"
  onerror="this.onerror=null;this.src='https://unpkg.com/@azure/msal-browser@2/lib/msal-browser.js'"></script>
<script src="sp-integracion.js"></script>
<script>
var estado = document.getElementById('estado');
function setEstado(t, cls){ estado.textContent = t; estado.className = cls || 'muted'; }

document.getElementById('btnLogin').onclick = async function(){
  try {
    setEstado('Abriendo login…');
    var acc = await SPTelice.login();
    var u = document.getElementById('user');
    u.textContent = acc.name; u.style.display = 'inline-block';
    document.getElementById('btnLeer').disabled = false;
    setEstado('Sesión iniciada. Pulsa «Leer 11 maestros».', 'ok');
  } catch(e){ setEstado('Error de login: ' + e.message, 'err'); }
};

document.getElementById('btnLeer').onclick = async function(){
  this.disabled = true;
  try {
    var DATOS = await SPTelice.leerTodo(function(m){ setEstado(m); });
    setEstado('Lectura completada.', 'ok');
    pintarResumen(DATOS);
    pintarMuestra(DATOS);
    window._DATOS = DATOS; // disponible en consola para inspección
  } catch(e){ setEstado('Error leyendo: ' + e.message, 'err'); }
  this.disabled = false;
};

function pintarResumen(D){
  var meta = D._meta || {};
  var h = '<table><tr><th>Maestro</th><th>Lista SP</th><th>Válidas</th><th>Total</th><th>Vacías</th></tr>';
  Object.keys(meta).forEach(function(k){
    var m = meta[k];
    h += '<tr><td>'+k+'</td><td>'+m.lista+'</td><td class="n">'+m.validas+'</td><td class="n">'+m.total+'</td><td class="n">'+m.vacias+'</td></tr>';
  });
  h += '</table>';
  document.getElementById('resumen').innerHTML = h;
  document.getElementById('resumenCard').style.display = '';
}

function pintarMuestra(D){
  var orden = ['proyectos','personal','maquinaria','partidas','partidasControl','subcontratas','materiales','moExterna','alquileres','indirectos','planificacion'];
  var h = '';
  orden.forEach(function(k){
    var arr = D[k] || [];
    h += '<h3>'+k+' ('+arr.length+')</h3>';
    h += arr.length ? '<pre>'+JSON.stringify(arr[0])+'</pre>' : '<div class="muted">(sin filas)</div>';
  });
  document.getElementById('muestra').innerHTML = h;
  document.getElementById('muestraCard').style.display = '';
}
</script>
</body>
</html>
